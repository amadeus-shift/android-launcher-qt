name: Build Release APK (arm64-v8a)

on:
  workflow_dispatch: {}
  push:
    branches:
      - master

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install utilities (gradle, wget, unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle wget unzip

      - name: Install Android commandline tools and SDK components
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -o cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q cmdline.zip -d "$HOME/cmdline-tools"
          mv "$HOME/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Accept Android SDK licenses
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

      - name: Show Gradle version
        run: gradle -v || true

      - name: Ensure Gradle wrapper
        run: |
          cd android || exit 0
          if [ ! -f ./gradlew ]; then
            echo "Gradle wrapper not found — generating wrapper (may use system gradle)." 
            gradle wrapper || true
          fi

      - name: Build Release APK (arm64-v8a)
        working-directory: android
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleRelease -PABI=arm64-v8a --no-daemon || exit 0

      - name: Collect APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            android/**/outputs/**/*.apk
            **/build/outputs/**/*.apk

      - name: Build log (tail)
        if: always()
        run: tail -n 200 android/build.gradle || true
